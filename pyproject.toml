[project]
name = "javis"
version = "0.1.0"
description = "JAVIS - Personal AI Assistant with Custom Fine-tuned Model"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your@email.com"}
]

dependencies = [
    # HTTP & API
    "httpx>=0.25.0",
    "websockets>=12.0",

    # Web Server
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",

    # CLI
    "typer>=0.9.0",
    "rich>=13.0.0",

    # Data Processing
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",

    # Database
    "sqlalchemy>=2.0.0",
    "chromadb>=0.4.0",

    # AI/ML
    "sentence-transformers>=2.2.0",
    "modal>=0.60.0",  # Modal.com serverless GPU

    # Scheduling
    "apscheduler>=3.10.0",

    # Utilities
    "aiofiles>=23.0.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
training = [
    "unsloth>=2024.1",
    "transformers>=4.36.0",
    "datasets>=2.16.0",
    "accelerate>=0.25.0",
    "bitsandbytes>=0.42.0",
    "peft>=0.7.0",
    "trl>=0.7.0",
]

voice = [
    "edge-tts>=6.1.9",       # TTS (Microsoft Edge Neural Voices)
    "sounddevice>=0.4.6",    # Microphone recording
    "soundfile>=0.12.1",     # Audio file processing
    "pygame>=2.5.0",         # Audio playback
]

dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
javis = "javis.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=javis --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=35"

[tool.coverage.run]
source = ["javis"]
branch = true
omit = [
    # Entry points
    "*/javis/__main__.py",
    "*/javis/interfaces/cli.py",
    # Training modules (requires GPU/special setup)
    "*/javis/training/pipeline.py",
    "*/javis/training/trainer.py",
    "*/javis/training/finetune.py",
    "*/javis/training/manage.py",
    "*/javis/training/remote.py",
    # Model clients (requires API keys/GPU)
    "*/javis/models/local_client.py",
    "*/javis/models/modal_client.py",
    # Voice modules (requires audio hardware)
    "*/javis/voice/*.py",
    "*/javis/voice/**/*.py",
    # Workflow modules (complex scheduler)
    "*/javis/workflows/*.py",
    # External integrations (requires API keys)
    "*/javis/integrations/*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*Protocol:",
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"
