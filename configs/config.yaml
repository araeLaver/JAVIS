# JAVIS Configuration

app:
  name: JAVIS
  version: "0.1.0"
  description: "Personal AI Assistant"

model:
  # RunPod Serverless Endpoint
  provider: runpod
  # endpoint_id는 .env에서 로드

  # 베이스 모델 정보
  base_model: "Qwen/Qwen2.5-7B-Instruct"
  adapter: null  # LoRA 어댑터 경로 (파인튜닝 후 설정)

  # 생성 파라미터
  generation:
    max_tokens: 2048
    temperature: 0.7
    top_p: 0.9
    stop_sequences: ["<|im_end|>", "<|endoftext|>"]

conversation:
  # 시스템 프롬프트
  system_prompt: |
    너는 JAVIS, 개발자를 위한 개인 AI 비서다.

    핵심 원칙:
    - 간결하고 정확하게 답변한다
    - 필요할 때 도구를 사용한다
    - 불확실한 것은 솔직히 말한다
    - 한국어로 답변한다

  # 대화 히스토리 최대 길이
  max_history: 20

  # 컨텍스트 윈도우
  max_context_tokens: 8000

tools:
  enabled: true  # Phase 3 활성화됨
  available:
    - file_tools
    - web_tools
    - system_tools
    - calendar_tools    # Phase 7
    - notion_tools      # Phase 7
    - slack_tools       # Phase 7

# Phase 4: Memory & RAG System
memory:
  long_term:
    enabled: true
    db_path: "./data/vectors/memory"
    collection_name: "javis_memory"
    embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
    summarize_after_turns: 10

rag:
  enabled: true
  db_path: "./data/vectors/documents"
  collection_name: "javis_documents"
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  chunk_size: 500
  chunk_overlap: 50
  top_k: 5
  min_relevance_score: 0.3

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "./logs/javis.log"

# 자동 재학습 파이프라인 설정
training:
  # 스케줄러 설정
  schedule:
    enabled: true
    cron: "0 0 * * 0"  # 매주 일요일 자정
    timezone: "Asia/Seoul"

  # 학습 환경: modal, local
  provider: "modal"

  # 데이터 조건
  data:
    min_conversations: 2       # 최소 대화 수 (테스트용)
    min_good_feedback: 0       # 최소 좋은 피드백 수 (테스트용)
    exclude_bad_feedback: true # 나쁜 피드백 제외
    max_age_days: 90           # 90일 이상 된 데이터 제외

  # 학습 하이퍼파라미터
  model:
    base_model: "Qwen/Qwen2.5-7B-Instruct"
    epochs: 1               # 테스트용 1 에폭
    batch_size: 2           # Modal A10G용
    learning_rate: 0.0002
    lora_r: 64
    lora_alpha: 16
    max_seq_length: 1024
    gradient_accumulation_steps: 4

  # 배포 설정
  deployment:
    auto_deploy: true          # 학습 완료 후 자동 배포
    validation_required: true  # 배포 전 검증 필수
    keep_versions: 5           # 보관할 버전 수

  # 알림 설정
  notifications:
    discord_webhook: null      # Discord 웹훅 URL
    on_success: true
    on_failure: true

  # Phase 5: 데이터 품질 설정
  data_quality:
    enabled: true
    min_score_for_training: 3.5  # 학습에 사용할 최소 품질 점수
    weights:
      feedback: 0.4
      length: 0.2
      coherence: 0.2
      recency: 0.2

  # Phase 5: 모델 검증 설정
  validation:
    enabled: true
    prompts_path: "./configs/validation_prompts.json"
    max_failures: 2              # 최대 허용 실패 수
    required_pass_rate: 0.8      # 필요한 통과율

  # Phase 5: 성능 메트릭 설정
  metrics:
    enabled: true
    retention_days: 90           # 메트릭 보관 기간
    aggregation_interval: "daily"

  # Phase 5: A/B 테스팅 설정
  ab_testing:
    enabled: false               # 기본적으로 비활성화
    default_traffic_split: 0.5   # 새 버전에 보낼 트래픽 비율
    min_sample_size: 100         # 최소 샘플 크기
    significance_threshold: 0.95 # 통계적 유의성 임계값

  # MLOps: MLflow 실험 추적
  mlflow:
    enabled: false               # MLflow 활성화 여부
    tracking_uri: "http://localhost:5000"  # MLflow 서버 URI
    experiment_name: "javis-training"      # 실험 이름
    artifact_location: null      # 아티팩트 저장 경로 (null = 기본값)
    log_models: true             # 모델 자동 로깅
    log_datasets: true           # 데이터셋 정보 로깅
    log_system_metrics: true     # 시스템 메트릭 로깅

  # MLOps: Optuna 하이퍼파라미터 최적화
  optuna:
    enabled: false               # HPO 활성화 여부
    study_name: "javis-hpo"      # 스터디 이름
    storage_uri: null            # 스터디 저장소 (null = 메모리)
    n_trials: 20                 # 시도 횟수
    timeout: null                # 시간 제한 (초, null = 무제한)
    direction: "minimize"        # 최적화 방향 (minimize/maximize)
    pruner: "median"             # 프루너 (median/hyperband/nop)
    sampler: "tpe"               # 샘플러 (tpe/random/cmaes)
    # 탐색 공간
    learning_rate_min: 0.00001   # 학습률 최소값
    learning_rate_max: 0.001     # 학습률 최대값
    batch_size_choices: [2, 4, 8]      # 배치 크기 후보
    lora_r_choices: [16, 32, 64, 128]  # LoRA rank 후보
    epochs_min: 1                # 에폭 최소값
    epochs_max: 5                # 에폭 최대값

# Phase 6: 음성 인터페이스 설정
voice:
  enabled: true
  language: "ko-KR"

  # STT (Speech-to-Text) 설정
  stt:
    provider: "groq_whisper"  # groq_whisper
    groq_whisper:
      model: "whisper-large-v3"
    recording:
      sample_rate: 16000
      silence_threshold: 500   # ms
      max_duration: 30         # seconds

  # TTS (Text-to-Speech) 설정
  tts:
    provider: "edge_tts"  # edge_tts
    edge_tts:
      voice: "ko-KR-SunHiNeural"  # 여성 음성 (ko-KR-InJoonNeural: 남성)
      rate: "+0%"
      pitch: "+0Hz"
    playback:
      auto_play: true

# Phase 6-2: 워크플로우 자동화 설정
workflows:
  enabled: true
  directory: "./configs/workflows"
  max_concurrent: 3
  default_timeout: 300  # 5분
  notifications:
    on_success: true
    on_failure: true

# Phase 7: 외부 서비스 연동
integrations:
  google_calendar:
    enabled: false  # GOOGLE_CREDENTIALS_PATH 환경변수 필요
    calendar_id: "primary"
    max_results: 10
  notion:
    enabled: false  # NOTION_API_KEY 환경변수 필요
    default_database_id: null
  slack:
    enabled: false  # SLACK_BOT_TOKEN 환경변수 필요
    default_channel: "#general"
